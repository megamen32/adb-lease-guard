name: Test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: mkdir -p .tmp/tmp .tmp/go-tmp .tmp/go-cache
      - run: go test ./... && go vet ./...
        env:
          TMPDIR: ${{ github.workspace }}/.tmp/tmp
          GOTMPDIR: ${{ github.workspace }}/.tmp/go-tmp
          GOCACHE: ${{ github.workspace }}/.tmp/go-cache
      - run: bash -n install.sh scripts/build-release.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile('install.ps1', [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - run: go test ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: bash scripts/build-release.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" .tmp/dist/* --title "${GITHUB_REF_NAME}" --generate-notes
